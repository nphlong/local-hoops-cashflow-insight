[project]
name = "local-hoops-pipeline"
version = "0.1.0"
description = "Ingest MB Bank statements into curated SQLite and export redacted tab JSON."
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1",
  "python-dotenv>=1.0",
  "cryptography>=43",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hoops-pipeline = "pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]

[tool.pytest.ini_options]
pythonpath = ["."]
